<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="训练打卡">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>舒尔特方格 · 训练打卡</title>
</head>
<body class="schulte-light">
  <header class="top">
    <div>
      <h1>🎯 舒尔特方格</h1>
      <div class="sub">从 1 按到最大数，越快越好</div>
    </div>
  </header>

  <main>
    <!-- 难度选择 -->
    <div class="seg" id="size-seg">
      <button data-size="3">3×3</button>
      <button data-size="4">4×4</button>
      <button data-size="5" class="on">5×5</button>
    </div>

    <!-- 计时器 -->
    <div class="card">
      <div class="timer"><span id="timer">0.0</span><small> 秒</small></div>
      <div style="text-align:center;color:var(--muted);font-size:13px" id="progress">点击「开始」准备</div>
      <div class="schulte-grid s5" id="grid"></div>
      <button class="btn" id="btn-start">▶ 开始</button>
      <button class="btn ghost" id="btn-quit" style="display:none">■ 放弃本次</button>
      <p class="chart-note">按顺序点击 1 → 2 → 3 … 直到最大数，点错不会停止计时。</p>
    </div>

    <!-- 当前难度最佳 -->
    <div class="best">
      <div class="b"><div class="v" id="best-time">—</div><div class="k">最佳（秒）</div></div>
      <div class="b"><div class="v" id="avg-time">—</div><div class="k">平均（秒）</div></div>
      <div class="b"><div class="v" id="total-times">0</div><div class="k">训练次数</div></div>
    </div>

    <!-- 耗时变化曲线 -->
    <section class="card">
      <h2><span class="dot" style="background:var(--accent2)"></span>耗时变化</h2>
      <div class="chart-box"><canvas id="chart"></canvas></div>
      <p class="chart-note">横轴是第几次训练，曲线向下说明你在进步。</p>
    </section>

    <!-- 历史记录 -->
    <section class="card">
      <h2><span class="dot" style="background:var(--green)"></span>历史记录</h2>
      <div class="record-list" id="record-list"></div>
    </section>
  </main>

  <nav class="bottom">
    <a href="index.html"><span class="ico">📝</span>记录</a>
    <a href="charts.html"><span class="ico">📈</span>进度</a>
    <a href="schulte.html" class="on"><span class="ico">🎯</span>舒尔特</a>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="chart.umd.min.js"></script>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    let toastTimer = null;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // ===== 状态 =====
    let state = { size: 5, mode: 'idle' }; // mode: idle | running | done
    let grid = [];        // 当前格子的数字
    let next = 1;         // 下一个要找的数字
    let errors = 0;       // 本次错误次数
    let startTs = 0;      // 开始时间戳
    let timerId = null;
    let chart = null;

    const fmtMs = (ms) => (ms / 1000).toFixed(1);

    // ===== 生成方格 =====
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 洗牌并展示（不启动计时）
    function prepareBoard() {
      clearInterval(timerId);
      const n = state.size;
      grid = shuffle(Array.from({ length: n * n }, (_, i) => i + 1));
      state.mode = 'idle';
      next = 1;
      errors = 0;
      $('timer').textContent = '0.0';
      $('progress').textContent = '点击「开始」计时，从 1 开始按';
      $('btn-start').textContent = '▶ 开始';
      $('btn-quit').style.display = 'none';
      renderGrid();
    }

    function startRound() {
      clearInterval(timerId);
      const n = state.size;
      grid = shuffle(Array.from({ length: n * n }, (_, i) => i + 1));
      next = 1;
      errors = 0;
      state.mode = 'running';
      startTs = performance.now();
      renderGrid();
      $('progress').textContent = '找到 1/' + (n * n);
      $('btn-start').textContent = '↻ 重新开始';
      $('btn-quit').style.display = 'block';
      timerId = setInterval(() => {
        $('timer').textContent = fmtMs(performance.now() - startTs);
      }, 100);
    }

    // 中途放弃：停止计时、重新洗牌，不记录成绩
    function quitRound() {
      if (state.mode !== 'running') return;
      clearInterval(timerId);
      prepareBoard();
      toast('已结束本次练习，成绩未保存');
    }

    function finish() {
      clearInterval(timerId);
      state.mode = 'done';
      const ms = Math.round(performance.now() - startTs);
      $('timer').textContent = fmtMs(ms);
      $('progress').textContent = '完成！耗时 ' + fmtMs(ms) + ' 秒';
      addSchulte(state.size, ms, errors);
      toast('🎉 完成 ' + state.size + '×' + state.size + '：' + fmtMs(ms) + ' 秒' + (errors ? '（点错 ' + errors + ' 次）' : ''));
      $('btn-start').textContent = '▶ 再来一次';
      $('btn-quit').style.display = 'none';
      refreshStats(); refreshList(); renderChart();
    }

    // ===== 渲染方格 =====
    function renderGrid() {
      const box = $('grid');
      box.className = 'schulte-grid s' + state.size;
      box.innerHTML = grid.map((v) =>
        '<button class="cell" data-n="' + v + '">' + v + '</button>'
      ).join('');
      box.querySelectorAll('.cell').forEach((b) =>
        b.addEventListener('click', () => onCell(b))
      );
    }

    function onCell(btn) {
      if (state.mode !== 'running') return;
      const n = parseInt(btn.dataset.n);
      if (n === next) {
        btn.disabled = true;
        btn.classList.add('ok'); // 短暂高亮反馈，随后恢复原样
        setTimeout(() => btn.classList.remove('ok'), 220);
        next++;
        const total = state.size * state.size;
        $('progress').textContent = next <= total ? '找到 ' + next + '/' + total : '';
        if (next > total) finish();
      } else {
        errors++;
        btn.classList.add('wrong');
        setTimeout(() => btn.classList.remove('wrong'), 300);
      }
    }

    // ===== 统计与历史 =====
    function records() {
      return getSchulte().filter((r) => r.size === state.size); // 新在前
    }

    function refreshStats() {
      const rs = records();
      const vals = rs.map((r) => r.ms);
      const best = vals.length ? Math.min.apply(null, vals) : null;
      const avg = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
      $('best-time').textContent = best != null ? fmtMs(best) : '—';
      $('avg-time').textContent = avg != null ? fmtMs(avg) : '—';
      $('total-times').textContent = vals.length;
    }

    function refreshList() {
      const box = $('record-list');
      const rs = records();
      if (!rs.length) {
        box.innerHTML = '<div class="empty">还没有 ' + state.size + '×' + state.size + ' 的记录，先来一局！</div>';
        return;
      }
      const now = Date.now();
      box.innerHTML = rs.map((r) => {
        const d = new Date(r.t);
        const datePart = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        const rel = (now - r.t) < 60000 ? '（刚刚）' : '';
        return '<div class="schulte-record">' +
          '<div class="info">' +
            '<div class="time">' + fmtMs(r.ms) + ' 秒' + (r.err ? ' <span style="color:var(--red);font-size:12px">错' + r.err + '</span>' : '') + '</div>' +
            '<div class="sub">' + datePart + rel + '</div>' +
          '</div>' +
          '<button class="del" data-id="' + r.id + '">✕</button>' +
          '</div>';
      }).join('');
      box.querySelectorAll('.del').forEach((b) =>
        b.addEventListener('click', () => {
          if (confirm('删除这条记录？')) {
            deleteSchulte(b.dataset.id);
            refreshStats(); refreshList(); renderChart();
          }
        })
      );
    }

    // ===== 耗时折线图 =====
    function renderChart() {
      const rs = records().slice().reverse(); // 时间正序（旧 → 新）
      const meta = { 3: '#10b981', 4: '#f59e0b', 5: '#ff5e3a' }[state.size];

      if (chart) chart.destroy();
      if (!rs.length) {
        $('chart').getContext('2d').clearRect(0, 0, $('chart').width, $('chart').height);
        return;
      }
      const last = rs.slice(-30);
      chart = new Chart($('chart'), {
        type: 'line',
        data: {
          labels: last.map((_, i) => '第' + (i + 1) + '次'),
          datasets: [{
            label: '耗时（秒）',
            data: last.map((r) => r.ms / 1000),
            borderColor: meta,
            backgroundColor: meta + '33',
            fill: true,
            tension: 0.35,
            pointRadius: 4,
            pointBackgroundColor: meta,
            borderWidth: 2.5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#273449',
              titleColor: '#f1f5f9',
              bodyColor: '#f1f5f9',
              displayColors: false,
              callbacks: { label: (ctx) => ' ' + ctx.parsed.y.toFixed(1) + ' 秒' }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(51,65,85,.35)' },
              ticks: { color: '#94a3b8', maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }
            },
            y: {
              beginAtZero: true,
              grid: { color: 'rgba(51,65,85,.35)' },
              ticks: { color: '#94a3b8' }
            }
          }
        }
      });
    }

    // ===== 事件 =====
    $('size-seg').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      state.size = parseInt(b.dataset.size);
      document.querySelectorAll('#size-seg button').forEach((x) => x.classList.toggle('on', x === b));
      prepareBoard();
      refreshStats(); refreshList(); renderChart();
    });

    $('btn-start').addEventListener('click', startRound);
    $('btn-quit').addEventListener('click', quitRound);

    // ===== 启动 =====
    prepareBoard();
    refreshStats(); refreshList(); renderChart();
  </script>
</body>
</html>

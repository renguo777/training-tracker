<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="训练打卡">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>每日训练打卡</title>
</head>
<body>
  <header class="top">
    <div>
      <h1>每日训练打卡</h1>
      <div class="sub" id="today-sub"></div>
    </div>
    <button class="icon" id="btn-settings" aria-label="设置">⚙️</button>
  </header>

  <main>
    <!-- 日期切换 -->
    <div class="datebar">
      <button id="btn-prev" aria-label="前一天">‹</button>
      <div class="date-label" id="date-label"></div>
      <button id="btn-next" aria-label="后一天">›</button>
    </div>

    <!-- 今日训练 -->
    <section class="card">
      <h2><span class="dot" style="background:var(--orange)"></span>训练记录</h2>
      <div class="training">
        <div class="row">
          <div class="name">💪 俯卧撑 <span class="unit">个</span></div>
          <div class="stepper">
            <button data-key="pushups" data-d="-1">−</button>
            <span class="val" id="v-pushups">—</span>
            <button data-key="pushups" data-d="1">+</button>
          </div>
        </div>
        <div class="row">
          <div class="name">🧱 平板支撑 <span class="unit">秒</span></div>
          <div class="stepper">
            <button data-key="plank" data-d="-10">−10</button>
            <span class="val" id="v-plank">—</span>
            <button data-key="plank" data-d="10">+10</button>
          </div>
        </div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:10px">点 ＋ 记录一次，点 － 调整。今天的数据会自动保存。</p>
    </section>

    <!-- 平板支撑计时 -->
    <section class="card">
      <h2><span class="dot" style="background:var(--accent2)"></span>平板支撑计时</h2>
      <div class="plank-clock" id="plank-clock">0:00</div>
      <div class="plank-status" id="plank-status">准备好就点「开始」，结束时自动保存成绩</div>
      <button class="btn" id="btn-plank">▶ 开始计时</button>
    </section>

    <!-- 今日汇总 -->
    <section class="card">
      <h2><span class="dot" style="background:var(--green)"></span>今日汇总</h2>
      <div class="summary">
        <div class="stat"><div class="num" id="sum-pushups">0</div><div class="lbl">俯卧撑（个）</div></div>
        <div class="stat"><div class="num" id="sum-plank">0</div><div class="lbl">平板支撑（秒）</div></div>
      </div>
    </section>

    <!-- 历史记录 -->
    <section class="card">
      <h2><span class="dot" style="background:var(--purple)"></span>历史记录</h2>
      <div class="record-list" id="record-list"></div>
    </section>
  </main>

  <!-- 设置弹窗 -->
  <div class="modal-mask" id="settings-mask">
    <div class="modal tools">
      <h3>⚙️ 设置</h3>
      <button class="btn" id="btn-export">📤 导出备份</button>
      <button class="btn ghost" id="btn-import">📥 导入备份</button>
      <input type="file" id="file-input" accept=".json,application/json" style="display:none">
      <button class="btn danger" id="btn-clear">🗑 清空全部数据</button>
      <div class="row2">
        <button class="btn ghost" id="btn-close-settings">关闭</button>
      </div>
      <p class="hint" style="margin-top:12px">数据仅保存在这部手机里。换手机前记得导出备份。</p>
    </div>
  </div>

  <nav class="bottom">
    <a href="index.html" class="on"><span class="ico">📝</span>记录</a>
    <a href="charts.html"><span class="ico">📈</span>进度</a>
    <a href="schulte.html"><span class="ico">🎯</span>舒尔特</a>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script>
    'use strict';
    // ===== 状态 =====
    let currentDate = todayStr(); // 当前查看/编辑的日期
    let today = todayStr();

    // ===== 工具函数 =====
    const $ = (id) => document.getElementById(id);
    let toastTimer = null;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
    }

    function refreshDateLabel() {
      $('date-label').textContent = fmtDate(currentDate) + (currentDate === today ? '（今天）' : '');
      $('today-sub').textContent = '坚持每一天，见证进步 💪';
      $('btn-next').disabled = currentDate >= today;
    }

    function refreshDay() {
      const d = getDay(currentDate);
      $('v-pushups').textContent = d.pushups ?? '—';
      $('v-plank').textContent = d.plank ?? '—';
      // 汇总
      const sum = { pushups: 0, plank: 0 };
      Object.entries(getAllDays()).forEach(([k, v]) => {
        if (k >= currentDate && k <= today) { sum.pushups += v.pushups || 0; sum.plank += v.plank || 0; }
      });
      $('sum-pushups').textContent = sum.pushups;
      $('sum-plank').textContent = sum.plank;
      refreshRecordList();
    }

    function getAllDays() {
      return load().days;
    }

    function refreshRecordList() {
      const box = $('record-list');
      const days = Object.keys(getAllDays()).sort().reverse();
      if (!days.length) {
        box.innerHTML = '<div class="empty">还没有记录，从今天开始吧！</div>';
        return;
      }
      box.innerHTML = days.map((k) => {
        const v = getDay(k);
        const items = [];
        if (v.pushups != null) items.push('俯卧撑 <b>' + v.pushups + '</b>');
        if (v.plank != null) items.push('平板 <b>' + v.plank + 's</b>');
        const vals = items.length ? items.join(' · ') : '<span style="opacity:.5">无</span>';
        return '<div class="record">' +
          '<div class="d">' + fmtDate(k) + '</div>' +
          '<div class="vals">' + vals + '</div>' +
          '<button class="del" data-date="' + k + '">✕</button>' +
          '</div>';
      }).join('');
      box.querySelectorAll('.del').forEach((b) =>
        b.addEventListener('click', () => {
          if (confirm('删除 ' + fmtDate(b.dataset.date) + ' 的记录？')) {
            deleteDay(b.dataset.date);
            toast('已删除');
            refreshDay();
          }
        })
      );
    }

    function adjust(key, delta) {
      const cur = getDay(currentDate)[key] || 0;
      const next = Math.max(0, cur + delta);
      setDay(currentDate, key, next);
      toast(key === 'pushups' ? '俯卧撑已保存' : '平板支撑已保存');
      refreshDay();
    }

    // ===== 平板支撑计时 =====
    let plank = { running: false, startTs: 0, timerId: null };
    function fmtClock(ms) {
      const total = Math.floor(ms / 1000);
      return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
    }
    function startPlank() {
      if (plank.running) return;
      plank.running = true;
      plank.startTs = performance.now();
      $('btn-plank').textContent = '■ 结束并保存';
      $('plank-status').textContent = '计时中… 坚持住！';
      plank.timerId = setInterval(() => {
        $('plank-clock').textContent = fmtClock(performance.now() - plank.startTs);
      }, 200);
    }
    function stopPlank() {
      if (!plank.running) return;
      clearInterval(plank.timerId);
      plank.running = false;
      const secs = Math.round((performance.now() - plank.startTs) / 1000);
      $('plank-clock').textContent = fmtClock(secs * 1000);
      setDay(currentDate, 'plank', secs);
      toast('🧱 平板支撑 ' + secs + ' 秒，已保存');
      $('btn-plank').textContent = '▶ 再来一次';
      $('plank-status').textContent = '已保存到今天的记录';
      refreshDay();
    }
    $('btn-plank').addEventListener('click', () => (plank.running ? stopPlank() : startPlank()));

    // ===== 事件 =====
    document.querySelectorAll('.stepper button').forEach((b) =>
      b.addEventListener('click', () => adjust(b.dataset.key, parseInt(b.dataset.d)))
    );

    $('btn-prev').addEventListener('click', () => {
      const d = dateOf(currentDate);
      d.setDate(d.getDate() - 1);
      currentDate = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      refreshDateLabel(); refreshDay();
    });
    $('btn-next').addEventListener('click', () => {
      if (currentDate >= today) return;
      const d = dateOf(currentDate);
      d.setDate(d.getDate() + 1);
      currentDate = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      refreshDateLabel(); refreshDay();
    });

    // 设置弹窗
    const mask = $('settings-mask');
    $('btn-settings').addEventListener('click', () => mask.classList.add('show'));
    $('btn-close-settings').addEventListener('click', () => mask.classList.remove('show'));
    mask.addEventListener('click', (e) => { if (e.target === mask) mask.classList.remove('show'); });

    $('btn-export').addEventListener('click', () => { exportJSON(); toast('已导出备份文件'); });
    $('btn-import').addEventListener('click', () => $('file-input').click());
    $('file-input').addEventListener('change', () => {
      const f = $('file-input').files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          importJSON(reader.result);
          toast('导入成功');
          refreshDay(); refreshDateLabel();
        } catch (e) {
          alert('导入失败：' + e.message);
        }
      };
      reader.readAsText(f);
      $('file-input').value = '';
    });
    $('btn-clear').addEventListener('click', () => {
      if (confirm('确定清空全部训练数据？此操作不可恢复！')) {
        save({ version: 1, days: {}, schulte: [] });
        toast('已清空');
        refreshDay(); refreshDateLabel();
        mask.classList.remove('show');
      }
    });

    // ===== 启动 =====
    refreshDateLabel();
    refreshDay();
  </script>
</body>
</html>
